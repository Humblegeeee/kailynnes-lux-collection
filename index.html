<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15110e" />
    <meta
      name="description"
      content="Kailynne's Lux Collection — bags and clothing curated in Accra for the modern Ghanaian woman."
    />
    <title>Kailynne's Lux Collection — Bags &amp; Clothing, Accra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paint the intro's dark backdrop before the app loads, so there is no light flash. */
      html.intro-pending,
      html.intro-pending body {
        background: #0f0c0a;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var seen = false;
        try {
          seen = sessionStorage.getItem('klc_intro_seen') === '1';
        } catch (e) {}
        var isAdmin = location.pathname.indexOf('/admin') === 0;
        root.classList.add(seen || isAdmin ? 'site-ready' : 'intro-pending');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
